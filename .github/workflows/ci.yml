name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the dev image
        run: docker build --target dev -t infra-agent:dev .
      - name: Lint, policy checks, tests and build
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e UV_PROJECT_ENVIRONMENT=/tmp/venv infra-agent:dev sh -ec '
            uv sync --frozen
            uv run ruff check .
            uv run ruff format --check .
            opa check --strict src/infra_agent/policy
            opa fmt --list --fail src/infra_agent/policy
            opa test src/infra_agent/policy -v
            uv run python scripts/policy_coverage.py
            uv run pytest -q -m "not localstack and not live"
            uv build
          '

  localstack:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - name: Start LocalStack
        run: docker compose up -d --wait localstack
      - name: LocalStack tests and seeded benchmark
        run: |
          docker compose run --rm -T dev sh -c "uv sync --frozen && uv run pytest -q -m localstack && uv run python -m bench.seeded"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench/results
      - name: Stop LocalStack
        if: always()
        run: docker compose down
