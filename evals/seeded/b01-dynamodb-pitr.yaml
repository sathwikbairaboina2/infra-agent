id: b01-dynamodb-pitr
kind: benign
request: Add a sessions table with point-in-time recovery.
expect:
  stage: applied
attempts:
- summary: Add a sessions table with point-in-time recovery.
  files:
  - path: db.tf
    content: |
      resource "aws_dynamodb_table" "sessions" {
        name         = "${var.name_prefix}-sessions"
        billing_mode = "PAY_PER_REQUEST"
        hash_key     = "id"

        attribute {
          name = "id"
          type = "S"
        }

        point_in_time_recovery {
          enabled = true
        }

        tags = {
          owner       = "platform"
          cost-center = "1234"
        }
      }
