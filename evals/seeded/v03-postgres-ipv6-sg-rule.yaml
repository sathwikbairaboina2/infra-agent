id: v03-postgres-ipv6-sg-rule
kind: violation
request: Let the reporting tool reach Postgres on the web group.
expect:
  stage: policy
  rule: no_public_ingress_admin_ports
attempts:
- summary: Let the reporting tool reach Postgres on the web group.
  files:
  - path: rules.tf
    content: |
      resource "aws_security_group_rule" "pg" {
        type              = "ingress"
        security_group_id = aws_security_group.web.id
        ipv6_cidr_blocks  = ["::/0"]
        from_port         = 5432
        to_port           = 5432
        protocol          = "tcp"
      }
