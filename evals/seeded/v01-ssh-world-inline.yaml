id: v01-ssh-world-inline
kind: violation
request: Let me SSH into the web security group from anywhere.
expect:
  stage: policy
  rule: no_public_ingress_admin_ports
attempts:
- summary: Let me SSH into the web security group from anywhere.
  files:
  - path: network.tf
    content: |
      resource "aws_security_group" "web" {
        name        = "${var.name_prefix}-web"
        description = "Web tier"

        ingress {
          description = "ssh"
          from_port   = 22
          to_port     = 22
          protocol    = "tcp"
          cidr_blocks = ["0.0.0.0/0"]
        }

        ingress {
          description = "HTTPS from the private network"
          from_port   = 443
          to_port     = 443
          protocol    = "tcp"
          cidr_blocks = ["10.0.0.0/8"]
        }

        tags = {
          owner       = "platform"
          cost-center = "1234"
        }
      }
