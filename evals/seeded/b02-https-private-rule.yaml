id: b02-https-private-rule
kind: benign
request: Allow HTTPS from the 10.20.0.0/16 network.
expect:
  stage: applied
attempts:
- summary: Allow HTTPS from the 10.20.0.0/16 network.
  files:
  - path: rules.tf
    content: |
      resource "aws_vpc_security_group_ingress_rule" "https" {
        security_group_id = aws_security_group.web.id
        cidr_ipv4 = "10.20.0.0/16"
        from_port         = 443
        to_port           = 443
        ip_protocol       = "tcp"

        tags = {
          owner       = "platform"
          cost-center = "1234"
        }
      }
